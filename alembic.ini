# be-message-service Alembic 配置
# 说明：sqlalchemy.url 不在此处硬编码，由 alembic/env.py 从 app.core.config.settings
#       动态注入（统一走环境变量 MYSQL_MESSAGE_URL），避免连接串分散在多处。

[alembic]
# 迁移脚本目录
script_location = %(here)s/alembic

# 迁移文件名带上时间前缀，便于按时间排序阅读
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# 把项目根目录加入 sys.path，使 env.py 能 import app.*
prepend_sys_path = .

path_separator = os

# database URL 由 env.py 动态设置
# sqlalchemy.url = driver://user:pass@localhost/dbname


[post_write_hooks]
# 不启用自动格式化钩子


# ==================== 日志 ====================
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
