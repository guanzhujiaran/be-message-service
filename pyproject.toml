[project]
name = "message-service"
version = "0.1.0"
description = "统一消息系统微服务：基于 RabbitMQ + FastStream + MySQL，包含推送 / 系统通知 / 事件提醒 / 私信 / 消息设置模块"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "faststream[cli,rabbit]>=0.6.0",
    "fastapi[standard]>=0.110.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "loguru>=0.7.2",
    "uvicorn>=0.51.0",
    "bili-common",
    # ===== 数据持久化（MySQL + SQLModel + Alembic）=====
    "sqlmodel>=0.0.27",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiomysql>=0.2.0",
    "pymysql>=1.1.2",
    # 只读直连 pptr（puppeteer_Bili）的 Postgres：评论 / 私信作者展示信息、@ 搜索等
    # 用户信息读取统一走本服务，不再在本库冗余 msg_user_profile 快照。
    "asyncpg>=0.29.0",
    # PyMySQL/aiomysql 处理 caching_sha2_password / sha256_password 认证需要 cryptography
    "cryptography>=42.0.0",
    "alembic>=1.13.0",
    "greenlet>=3.0.0",
    # ===== 定时任务（非活跃用户批量推送 / 定时通知发布）=====
    "apscheduler>=3.10.4",
    "sqlacodegen>=4.0.4",
    # psycopg2-binary 自带 libpq（manylinux wheel），免去构建期源码编译所需的 gcc / libpq-dev
    "psycopg2-binary>=2.9.12",
    # ===== JWT + Casdoor（用户网关下沉 be-message）=====
    "pyjwt>=2.8.0",
    "httpx>=0.27.0",
    "casdoor>=1.41.0",
    # ===== GeoIP（IP 属地解析，动态发布时自动填充位置）=====
    "geoip2>=4.8.0",
    "fastapi-i18n>=0.12.0",
    "tqdm>=4.70.0",
    "lightgbm>=4.7.0",
    "scikit-learn>=1.9.1",
    "implicit>=0.7.3",
    "psycopg2>=2.9.13",
]

[tool.uv]
index-strategy = "unsafe-best-match"
python-install-mirror = "https://registry.npmmirror.com/-/binary/python-build-standalone/"

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[[tool.uv.index]]
name = "tencent"
url = "https://mirrors.cloud.tencent.com/pypi/simple/"

[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"

[tool.uv.sources]
# 本地路径依赖，默认 editable（本地开发改 bili-common 源码即时生效）。
# Docker 构建时通过 UV_NO_EDITABLE=1 环境变量强制按非 editable 安装，
# bili-common 会被复制进 site-packages，ty 可解析且不依赖宿主机绝对路径。
bili-common = { path = "../bili-common", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    # 需要真实 RabbitMQ 的集成测试（broker 不可达时测试内自动 skip）：
    #   RABBITMQ_URL='amqp://user:pwd@127.0.0.1:5672/?heartbeat=180' uv run pytest -m integration -v
    "integration: 需要真实 RabbitMQ 的端到端 RPC 集成测试",
]

[tool.ruff]
# 不显式配置的话，检查结果取决于运行环境的默认 / 用户级配置（本机实测会混入
# SIM/UP/TRY 等规则），结果不可复现 —— 这里锁定项目口径（计划书 §5.27）。
target-version = "py311"
line-length = 88
# ruff 默认已排除 .venv / __pycache__；迁移脚本是生成代码但同样纳入检查。

[tool.ruff.lint]
select = [
    "E4",  # pycodestyle：导入相关
    "E7",  # pycodestyle：缩进等
    "E9",  # pycodestyle：语法类错误（含 E999）
    "F",   # pyflakes：未定义名 / 未用导入 / 未用变量
    "I",   # isort：导入排序
    "B",   # flake8-bugbear：易踩的坑
    "UP",  # pyupgrade：语法现代化
    "SIM", # flake8-simplify：可简化写法
    "RET", # flake8-return
    "C4",  # flake8-comprehensions
    "RUF", # ruff 自带规则
]
ignore = [
    "E501",   # 行宽交给 formatter，linter 不管
    "E712",   # SQLModel / SQLAlchemy 列比较必须写 col(X) == False：ruff 建议的
              # `not X` 在 SQL 表达式里语义不同（会改坏查询条件），不能开
    "B008",   # FastAPI 依赖注入的基本写法（x: int = Query(...) / Depends(...)）
    "B024",   # 抽象基类的空钩子方法 / 无抽象方法的基类：本项目的 Biz / 状态机基类是
    "B027",   # 「默认空实现」约定（子类按需覆盖），不是漏写 @abstractmethod
    "RUF012", # 类级容器（注册表 _registry、常量映射 ROLE_BIZ_PERMS / error_messages、
              # SQLModel __table_args__、测试记录器）都是**有意共享**的，逐处加 ClassVar
              # 只有注解收益，噪音大于价值
    "SIM105", # `except: pass` → contextlib.suppress 属可读性偏好，不强改既有写法
    "RUF001", # 中文注释 / docstring 的全角标点（，：（））被判为「歧义 Unicode 字符」，
    "RUF002", # 本项目注释全中文，单这一族就是 2 万+ 条纯噪音（计划书 §5.27）
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# alembic 模板：必须先 sys.path.append 再 import app，且迁移要靠 `import *` 收全表
"alembic/env.py" = ["E402", "F403"]
"alembic_pptr/env.py" = ["E402", "F403"]
# 一次性运维脚本：同样是先补 sys.path 再 import
"scripts/*" = ["E402"]
"tests/test_moment_interaction.py" = ["E402"]

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=2.4.0",
]

[tool.ty.environment]
# bili-common 在本地以 editable 方式安装（MetaPathFinder / .pth 中执行 import 语句），
# ty 不做动态执行，无法静态解析该包；这里把其源码目录加入优先搜索路径。
# 相对路径基于本 pyproject 所在目录（be-message-service）：../bili-common 即仓库内的 bili-common 目录，
# 该目录内含 bili_common 包。Docker 构建时 bili-common 也被 COPY 到 /bili-common，
# 相对 ../bili-common 同样成立，两套环境均可解析。
extra-paths = ["../bili-common"]
