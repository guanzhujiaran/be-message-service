# be-message-service 接管 pptr Postgres（PTR_Bili_Lot）的 Alembic 配置
# 说明：sqlalchemy.url 由 env.py 从 app.core.config.settings.postgres_pptr_url
#       动态注入（同步驱动版），不在此硬编码。

[alembic]
script_location = %(here)s/alembic_pptr

file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

prepend_sys_path = .

path_separator = os

# database URL 由 env.py 动态设置
# sqlalchemy.url = driver://user:pass@localhost/dbname


[post_write_hooks]
# 不启用自动格式化钩子


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
